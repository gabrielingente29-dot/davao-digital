<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
        background: #081627;
        color: #eaf0f8;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      .wash {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 60% 70% at 12% 0%, rgba(30,111,217,0.38), transparent 62%),
          radial-gradient(ellipse 55% 65% at 96% 100%, rgba(23,190,187,0.30), transparent 62%),
          radial-gradient(ellipse 40% 50% at 78% 12%, rgba(76,175,80,0.20), transparent 60%);
      }
      .grid {
        position: absolute; inset: 0; opacity: 0.5;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, #000 30%, transparent 100%);
        mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, #000 30%, transparent 100%);
      }
      .row { position: relative; display: flex; align-items: center; gap: 18px; }
      .tile {
        width: 62px; height: 62px; border-radius: 17px; flex-shrink: 0;
        background: linear-gradient(135deg, #1e6fd9 0%, #17bebb 55%, #4caf50 100%);
        display: grid; place-items: center;
        box-shadow: 0 14px 34px -12px rgba(30,111,217,0.8);
      }
      .brand { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
      .brand span { font-weight: 500; color: #a8bcd2; }
      .sub { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #7e93ab; margin-top: 5px; }
      h1 {
        position: relative;
        font-size: 76px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.02;
        max-width: 940px;
      }
      h1 em { font-style: normal; color: #5aa9ff; }
      .pills { position: relative; display: flex; gap: 12px; }
      .pill {
        font-size: 16px; font-weight: 600; padding: 10px 20px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.16); color: #cfdae8;
        background: rgba(255,255,255,0.05);
      }
      .pill.hot {
        background: #1e6fd9; border-color: transparent; color: #fff;
        box-shadow: 0 12px 30px -12px rgba(30,111,217,0.9);
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="grid"></div>

    <div class="row">
      <div class="tile">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M11.6 4.3 4.7 15.2h4.3l2.6-4.3 2.6 4.3h4.3L11.6 4.3Z" fill="#fff" fill-opacity="0.96" />
          <path d="M3.4 20.5c2.8-2.7 5.5-4 8.2-4s5.4 1.3 8.2 4" stroke="#fff" stroke-opacity="0.62" stroke-width="1.4" stroke-linecap="round" />
          <circle cx="6.5" cy="18.6" r="1.15" fill="#fff" />
          <circle cx="16.7" cy="18.6" r="1.15" fill="#fff" />
        </svg>
      </div>
      <div>
        <div class="brand">Davao <span>Digital</span></div>
        <div class="sub">Web Design · Davao City</div>
      </div>
    </div>

    <h1>Your business, online in <em>7 days.</em></h1>

    <div class="pills">
      <div class="pill hot">Free site preview</div>
      <div class="pill">From ₱15,000</div>
      <div class="pill">Davao City · Philippines</div>
    </div>
  </body>
</html>
