<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081627" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script>
      (function () {
        var theme;
        try {
          var pref = localStorage.getItem("gm:theme");
          var systemLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = pref === "dark" || pref === "light" ? pref : systemLight ? "light" : "dark";
        } catch (e) {
          theme = "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#081627");
      })();
    </script>
    <script>
      (function () {
        var reduced;
        try {
          var pref = localStorage.getItem("gm:motion");
          reduced =
            pref === "reduced" ||
            (pref !== "full" && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        } catch (e) {
          reduced = false;
        }
        document.documentElement.dataset.motion = reduced ? "reduced" : "full";
      })();
    </script>
