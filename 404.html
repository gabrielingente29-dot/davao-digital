<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081627" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script>
      (function () {
        var theme;
        try {
          var pref = localStorage.getItem("gm:theme");
          var systemLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = pref === "dark" || pref === "light" ? pref : systemLight ? "light" : "dark";
        } catch (e) {
          theme = "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#081627");
      })();
    </script>
    <script>
      (function () {
        var reduced;
        try {
          var pref = localStorage.getItem("gm:motion");
          reduced =
            pref === "reduced" ||
            (pref !== "full" && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        } catch (e) {
          reduced = false;
        }
        document.documentElement.dataset.motion = reduced ? "reduced" : "full";
      })();
    </script>

    <title>Page not found | Davao Digital</title>
    <meta
      name="description"
      content="We couldn't find that page. Head back to Davao Digital's home page, see our pricing, or get a free website preview for your Davao business."
    />
    <meta name="robots" content="noindex, follow" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Page not found — Davao Digital, web design and digital marketing in Davao City. Head back to
      https://davaodigital.com or call +63 969 193 3721.
    </noscript>
    <script type="module" src="/src/entries/not-found.tsx"></script>
  </body>
</html>
