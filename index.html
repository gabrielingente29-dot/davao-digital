    <!-- ===== THEME PREFERENCE (before first paint, no flash) =====
         Resolves the visitor's theme choice once so CSS paints the right palette
         before React boots. Defaults to the OS `prefers-color-scheme`. -->
    <script>
      (function () {
        var theme;
        try {
          var pref = localStorage.getItem("gm:theme");
          var systemLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          if (pref === "dark" || pref === "light") {
            theme = pref;
          } else {
            theme = systemLight ? "light" : "dark";
          }
        } catch (e) {
          theme = "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);

        // Keep the browser chrome chrome-bar / mobile tab colour in sync.
        var meta = document.getElementById("theme-color-meta");
        if (meta) {
          meta.setAttribute("content", theme === "light" ? "#ffffff" : "#081627");
        }
      })();
    </script>

    <!-- ===== MOTION PREFERENCE (before first paint, no flash) =====
         Resolves the visitor's motion choice once so CSS and the cursor layer
         both know about it before React boots. Defaults to the OS setting. -->
    <script>
      (function () {
        var reduced;
        try {
          var pref = localStorage.getItem("gm:motion");
          reduced =
            pref === "reduced" ||
            (pref !== "full" && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        } catch (e) {
          reduced = false;
        }
        document.documentElement.dataset.motion = reduced ? "reduced" : "full";
      })();
    </script>
